[tool.poetry]
name = "document-pipeline"
version = "1.0.0"
description = "A powerful, modular document processing framework that transforms various document formats into structured outputs with optional vector database storage"
authors = ["Document Pipeline Contributors"]
readme = "README.md"
license = "Apache-2.0"
keywords = ["document-processing", "pdf", "ocr", "nlp", "docling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "doc_processing"}]

[tool.poetry.dependencies]
# Floor raised 3.10 -> 3.13 (2026-09-17, flow ruling). The <3.14 ceiling is deliberate: Poetry
# otherwise selects Homebrew python3.14, where youtube-transcript-api is excluded by marker and
# the declared dependency set does not install. 3.13 is a supported interpreter inside that
# ceiling and needs no OCR migration (onnxruntime <=1.23.2 ships cp313 wheels).
python = ">=3.13,<3.14"
typer = ">=0.15.2,<0.27"
pydantic-settings = "^2.9.1"
tenacity = "^9.1.2"
yt-dlp = {extras = ["default"], version = "^2026.7.4"}
langchain-text-splitters = "^1.1.2"
mammoth = "^1.6.0"
markitdown = {extras = ["pptx"], version = "^0.1.0"}
openpyxl = "^3.1.2"
pandas = "^2.2.0"
PyMuPDF = "^1.24.0"
ffmpeg-python = "^0.2.0"
python-docx = "^1.2.0"
tqdm = "^4.67.1"
openai = "^3.0.0"
deepl = "^1.22.0"
youtube-transcript-api = {version = "~1.2.2", python = ">=3.10,<3.14"}
docling = "^2.57.0"
onnxruntime = "<=1.23.2"
google-genai = "^2.17.0"
anthropic = "^0.121.0"
tiktoken = "^0.13.0"
pytesseract = "^0.3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs local gitignored fixtures (data/input) or runs end-to-end pipelines",
]
# Local-first default: the fast unit suite runs anywhere; opt in to fixture- and
# network-dependent checks with `poetry run pytest -q -m integration`.
addopts = "-m 'not integration'"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
