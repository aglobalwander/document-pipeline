[tool.poetry]
name = "document-pipeline"
version = "1.0.0"
description = "A powerful, modular document processing framework that transforms various document formats into structured outputs with optional vector database storage"
authors = ["Document Pipeline Contributors"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/yourusername/pipeline-documents"
repository = "https://github.com/yourusername/pipeline-documents"
documentation = "https://github.com/yourusername/pipeline-documents/tree/main/docs"
keywords = ["document-processing", "pdf", "ocr", "nlp", "docling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
packages = [{include = "doc_processing"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = ">=0.15.2,<0.27"
pydantic-settings = "^2.9.1"
tenacity = "^9.1.2"
yt-dlp = {extras = ["default"], version = "^2026.7.4"}
langchain-text-splitters = "^1.1.2"
mammoth = "^1.6.0"
markitdown = {extras = ["pptx"], version = "^0.1.0"}
openpyxl = "^3.1.2"
pandas = "^2.2.0"
PyMuPDF = "^1.24.0"
ffmpeg-python = "^0.2.0"
python-docx = "^1.2.0"
tqdm = "^4.67.1"
openai = "^3.0.0"
deepl = "^1.22.0"
youtube-transcript-api = {version = "~1.2.2", python = ">=3.10,<3.14"}
docling = "^2.57.0"
onnxruntime = "<=1.23.2"
google-genai = "^2.17.0"
anthropic = "^0.121.0"
tiktoken = "^0.13.0"
pytesseract = "^0.3.13"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
